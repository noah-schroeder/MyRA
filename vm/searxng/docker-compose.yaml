# SearXNG — the single search backend for Karen, general and academic alike.
#
# Based on the upstream template at
# https://raw.githubusercontent.com/searxng/searxng/master/container/docker-compose.yml
# with three deliberate changes:
#
#   1. The published port is pinned to 127.0.0.1, so it is reachable only from
#      inside this VM -- not from the host, not from the LAN.
#   2. The core service is hardened: no capabilities beyond the three the image
#      needs to drop privileges, and no privilege escalation.
#   3. Log output is capped, so a long-running instance cannot fill the disk.
#   4. No Valkey: it exists to back the rate limiter, which a private
#      single-user instance turns off. See the note at the foot of this file.
#
# The cache uses a NAMED VOLUME, not a bind mount, exactly as upstream does:
# the container writes as its own unprivileged user, and a host directory would
# be owned by the wrong uid.
name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    # The host-side restriction is written literally as 127.0.0.1. It must NOT
    # come from SEARXNG_HOST: env_file passes that variable INTO the container,
    # where it means "the address SearXNG binds". Setting it to 127.0.0.1 makes
    # SearXNG listen on the container's own loopback, which the port forwarder
    # cannot reach -- the connection is accepted and then answers nothing.
    #
    # Both sides of the mapping use the same variable, so the published port and
    # the port SearXNG actually binds can never drift apart.
    ports:
      - 127.0.0.1:${SEARXNG_PORT:-8888}:${SEARXNG_PORT:-8888}
    env_file: ./.env
    volumes:
      - ./core-config/:/etc/searxng/:rw
      - core-data:/var/cache/searxng/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

# Upstream's template also starts a Valkey container. It is deliberately absent
# here: per SearXNG's docs, "the limiter requires a Valkey database", and the
# limiter is bot protection for PUBLIC instances. This one is on loopback with a
# single caller, so the limiter is off and Valkey would have nothing to do.
# Adding it back means setting `valkey.url` (or SEARXNG_VALKEY_URL) too --
# without that, the container runs connected to nothing.

volumes:
  core-data:
