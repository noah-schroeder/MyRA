# Karen's SearXNG instance. Single user, private, loopback-only.
use_default_settings: true

general:
  instance_name: "Karen"
  # No usage statistics collected, even locally.
  enable_metrics: false

server:
  # Supplied by SEARXNG_SECRET from .env; never commit a real one.
  secret_key: "replaced-at-runtime-by-SEARXNG_SECRET"
  # The limiter exists to stop bots abusing PUBLIC instances. This one is bound
  # to loopback with a single caller, so it would only ever throttle us.
  limiter: false
  public_instance: false
  # Karen never renders images, so there is nothing to proxy.
  image_proxy: false

search:
  safe_search: 0
  # No autocomplete: it would send partial queries upstream on every keystroke.
  autocomplete: ""
  # REQUIRED. Without "json" here, ?format=json returns HTTP 403 — the single
  # most common reason a SearXNG API integration silently fails.
  formats:
    - html
    - json

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20

ui:
  infinite_scroll: false
