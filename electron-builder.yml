appId: dev.myra.app
productName: MyRA
# Pinned: electron-builder cannot infer the version when electron is a
# devDependency of a package that does not list it as a direct dependency.
electronVersion: 43.4.1
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
linux:
  # deb for Debian/Ubuntu; AppImage for everyone else -- it needs no package
  # manager and no root, at the cost of the deb's declared dependencies: an
  # AppImage can't ask apt for poppler-utils, so pdftotext falls back to
  # whatever is already on PATH (see office.ts) or is simply absent.
  target: [deb, AppImage]
  icon: build/icons
  # Semicolon-separated: electron-builder writes this straight into
  # Categories=, and the desktop.entry override does not reach that field.
  category: Office;Education;Science
  executableName: myra
  synopsis: A private, local-first assistant for academic work
  desktop:
    entry:
      Name: MyRA
      Comment: Meeting notes, research synthesis and document drafting
      Categories: Office;Education;Science;
mac:
  target: [dmg]
  icon: build/icon.png
  category: public.app-category.productivity
  # Unsigned, deliberately, and not ad-hoc signed.
  #
  # electron-builder from v26.0.13 (this repo is on ^26.15.3) has a regression
  # where an ad-hoc signed app passes signature verification, opens an audio
  # stream successfully, and then receives nothing: the microphone produces
  # silence and the camera LED never lights. It does not error. For an app whose
  # two headline features are dictation and meeting capture, that is the worst
  # available failure, so `null` skips signing rather than signing ad-hoc.
  #
  # The cost is the first-launch "Apple could not verify" dialog, which is one
  # trip through System Settings → Privacy & Security → Open Anyway. A paid
  # Developer ID removes the dialog and fixes none of the audio problems.
  identity: null
  # macOS refuses microphone access outright unless the app says why it wants
  # it, and shows this string in the prompt. Written for the person reading it
  # at the moment they press Record, not for a plist.
  extendInfo:
    # Accurate rather than reassuring. MyRA transcribes locally by default, but
    # the transcription endpoint is a setting and can be pointed at a remote
    # server -- so a flat "never leaves your computer" here would be a promise
    # the app does not always keep, in the one dialog the user cannot skip.
    NSMicrophoneUsageDescription: >-
      MyRA records meetings and takes dictation on this machine. Recordings are
      kept on your computer and transcribed by whichever service you configure —
      by default, one running locally.
    # Screen Recording has no Info.plist key of its own -- macOS prompts for it
    # when the capture is attempted -- but system audio is taken through the
    # same API, and this is the only place to explain that beforehand.
    NSAudioCaptureUsageDescription: >-
      MyRA records the other side of a call so meeting notes include everyone,
      not only you. Recordings are kept on your computer and transcribed by
      whichever service you configure — by default, one running locally.
win:
  target: [nsis]
  icon: build/icon.png
appImage:
  artifactName: MyRA-${version}-${arch}.AppImage
deb:
  packageName: myra
  artifactName: myra_${version}_${arch}.deb
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
    # poppler's `pdftotext`, which is how MyRA reads a PDF -- the research
    # pipeline's full texts, and a manuscript dropped on the peer review page.
    # It was always required and never declared, so on a machine without it a
    # PDF produced nothing next to a message naming a package the user had no
    # reason to have heard of.
    - poppler-utils
